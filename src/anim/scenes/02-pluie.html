<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebord sous la pluie</title>
    <link rel="stylesheet" href="scene.css?v=2" />
    <script src="plein.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        /* Fond de demonstration : la scene, elle, est transparente. */
        background: #0e0b09;
      }

      /* La tension chaud / lilas est ici structurelle, pas decorative :
         le froid vient du dehors, le chaud de la piece derriere nous. */
      .pluie {
        --teinte: rgba(168, 148, 214, 0.8);
        --sens: 190deg;
        --chute-pluie: 480px;
      }

      /* Elle est assise plus haut que dans la chambre : sur le rebord. */
      .pluie .place { bottom: 23%; height: 60%; }
      .pluie .ombre { bottom: 22.5%; width: 40%; height: 4%; }

      /* ---------- la fenetre ---------- */

      .fenetre {
        position: absolute;
        left: 9%;
        right: 9%;
        top: 5%;
        bottom: 24%;
        border-radius: 3px;
        overflow: hidden;
        background: linear-gradient(
          172deg,
          #23203a 0%,
          #1d1b2e 42%,
          #191725 100%
        );
      }

      /* Ce qu'on voit dehors : rien de net, une nuit mouillee. */
      .fenetre .dehors {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 40% at 74% 16%,
            rgba(168, 148, 214, 0.3) 0%, transparent 62%),
          radial-gradient(ellipse 90% 50% at 20% 92%,
            rgba(96, 84, 132, 0.28) 0%, transparent 68%);
      }

      /* Un lampadaire lointain, flou : donne une profondeur au dehors. */
      .fenetre .lampadaire {
        position: absolute;
        left: 71%;
        top: 22%;
        width: 13%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 206, 148, 0.85) 0%,
          rgba(255, 176, 104, 0.3) 34%,
          transparent 68%
        );
        filter: blur(6px);
        animation: lampadaire 6.5s ease-in-out infinite;
      }
      @keyframes lampadaire {
        0%, 100% { opacity: 0.7; scale: 1; }
        45% { opacity: 1; scale: 1.06; }
      }

      .fenetre .rideau-pluie { position: absolute; inset: -14% 0 0 0; }

      /* Buee : elle monte du bas de la vitre, la ou l'air de la piece est
         le plus chaud. Les gouttes l'essuient en passant. */
      .fenetre .buee {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(214, 210, 232, 0.2) 0%,
          rgba(214, 210, 232, 0.08) 34%,
          transparent 62%
        );
        animation: buee 13s ease-in-out infinite;
      }
      @keyframes buee {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .fenetre .ruissellement { position: absolute; inset: 0; }

      /* Son souffle embue la vitre a hauteur de museau, au rythme de sa
         respiration. Meme duree que --boucle, decale d'un temps. */
      .fenetre .souffle-buee {
        position: absolute;
        left: 34%;
        top: 34%;
        width: 26%;
        aspect-ratio: 1.4;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(226, 222, 242, 0.34) 0%,
          transparent 66%
        );
        filter: blur(5px);
        animation: souffle-buee var(--boucle) ease-in-out infinite;
      }
      @keyframes souffle-buee {
        0%, 100% { opacity: 0; scale: 0.75; }
        30% { opacity: 1; scale: 1.05; }
        64% { opacity: 0.25; scale: 1.15; }
      }

      /* ---------- menuiserie ---------- */

      .cadre {
        position: absolute;
        left: 9%;
        right: 9%;
        top: 5%;
        bottom: 24%;
        border: 9px solid #3d2e23;
        border-radius: 4px;
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.5),
          inset 0 14px 28px rgba(0, 0, 0, 0.45);
      }
      /* Meneau vertical, decale : centre il couperait la scene en deux. */
      .cadre::before {
        content: "";
        position: absolute;
        left: 62%;
        top: 0;
        bottom: 0;
        width: 7px;
        background: linear-gradient(90deg, #4a3829, #2a2018);
      }
      .cadre::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 38%;
        height: 6px;
        background: linear-gradient(180deg, #4a3829, #2a2018);
      }

      /* ---------- le rebord ---------- */

      .rebord {
        position: absolute;
        left: 3%;
        right: 3%;
        bottom: 15%;
        height: 8%;
        border-radius: 2px 2px 4px 4px;
        background: linear-gradient(
          180deg,
          #6a5340 0%,
          #55412f 38%,
          #35281e 39%,
          #241b14 100%
        );
        box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.8);
      }
      /* Le nez du rebord attrape la lumiere de la piece. */
      .rebord::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 36%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 196, 132, 0.4) 26%,
          rgba(255, 196, 132, 0.16) 62%,
          transparent
        );
      }

      /* ---------- lumieres de la piece ---------- */

      /* Chaud, bas, derriere le spectateur : c'est ce qui la detache du
         froid de la vitre. */
      .lampe-piece {
        background: radial-gradient(
          ellipse 66% 40% at 24% 96%,
          rgba(255, 172, 92, 0.42) 0%,
          rgba(255, 140, 60, 0.14) 40%,
          transparent 74%
        );
        animation: lampe-piece 7.5s ease-in-out infinite;
      }
      @keyframes lampe-piece {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }

      /* Second calque d'eclairage sur elle : le chaud de la piece, par le
         bas. .eclairage porte deja le froid de la vitre, par le haut. */
      .contre-chaud {
        position: absolute;
        inset: 0;
        -webkit-mask: url("../perso/ninf.svg") center / contain no-repeat;
        mask: url("../perso/ninf.svg") center / contain no-repeat;
        background: linear-gradient(
          348deg,
          rgba(255, 176, 100, 0.5) 0%,
          transparent 48%
        );
        mix-blend-mode: soft-light;
      }
    </style>
  </head>
  <body>
    <div class="scene pluie">
      <div class="fenetre">
        <div class="dehors"></div>
        <div class="lampadaire"></div>
        <div class="rideau-pluie" id="rideau"></div>
        <div class="buee"></div>
        <div class="souffle-buee"></div>
        <div class="ruissellement" id="ruissellement"></div>
      </div>
      <div class="cadre"></div>

      <div class="couche lampe-piece"></div>
      <div class="rebord"></div>
      <div class="ombre"></div>

      <div class="place"><div class="perso" id="perso"></div></div>

      <div class="couche grain"></div>
    </div>

    <script type="module" src="02-pluie.boot.js"></script>
  </body>
</html>
