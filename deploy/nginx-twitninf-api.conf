# Répartition de charge de l'API twitninf — VPS A (edge) et VPS B (via WireGuard).
#
# Ce fichier est la copie versionnée de /etc/nginx/sites-enabled/twitninf-api.
# Il n'existait nulle part dans le dépôt : la configuration d'entrée de la
# production ne vivait que sur le serveur.

# ── Groupe réparti ───────────────────────────────────────────────────────────
# Le hash cohérent colle un client à un nœud. Ce n'est pas pour l'état
# applicatif (il est partagé via Redis), mais pour socket.io : quand le
# navigateur retombe en transport polling, une poignée de main entamée sur un
# nœud doit se terminer sur le même. Le mode `consistent` évite de remapper la
# majorité des clients lorsqu'une réplique C est ajoutée ou retirée.
#
# A dispose de 6 vCPU contre 2 pour B. Le benchmark à 500 utilisateurs a montré
# qu'un partage 50/50 saturait B alors qu'A restait sous les 200 ms de p95.
# Les poids 13:7 visent donc environ 65 % du trafic sur A et 35 % sur B.
# `max_fails` + `fail_timeout` sortent un nœud mort du groupe automatiquement.
map $request_method $twitninf_api_pool {
    default twitninf_api;
    # GET/HEAD passent sur le pool de lecture quand l'autoscaler detecte la
    # semi-surcharge de A.
    include /etc/nginx/twitninf-read-routing.map;
}

upstream twitninf_api {
    hash $binary_remote_addr consistent;
    server 127.0.0.1:3001 weight=13 max_fails=2 fail_timeout=10s;
    server 10.8.0.2:3001  weight=7  max_fails=2 fail_timeout=10s;
    # Fichier rendu atomiquement par twitninf-autoscaler (C dynamiques sur A).
    include /etc/nginx/twitninf-autoscale-upstreams.conf;
}

# ── Pool de lecture ──────────────────────────────────────────────────────────
# Actif uniquement quand l'autoscaler constate la semi-surcharge de A. Il ne
# recoit que des GET/HEAD : cote applicatif, B sert alors ces SELECT depuis son
# PostgreSQL local (DB_ORM_READ_HOST), donc chaque requete deviee ici est une
# requete que la base de A ne voit plus. C'est le seul levier qui soulage
# vraiment le primaire — un C soulage le CPU de Node, pas PostgreSQL, puisqu'il
# interroge la meme base que A.
#
# D'ou les poids : le process principal de A est fortement reduit (4), B est
# privilegie (20), et les C gardent leur part via l'include ci-dessous.
#
#   sans C     : B recoit ~83 % des lectures
#   avec 3 C   : B recoit ~32 % des lectures, contre 12 % hors report
#
# A reste present afin que la lecture continue si B devient indisponible.
upstream twitninf_api_read {
    hash $binary_remote_addr consistent;
    server 127.0.0.1:3001 weight=4  max_fails=2 fail_timeout=10s;
    server 10.8.0.2:3001  weight=20 max_fails=2 fail_timeout=10s;
    # Sans cet include, activer le report de lecture *excluait* les C du trafic
    # GET/HEAD — c'est-a-dire de l'essentiel du trafic — au moment precis ou
    # l'autoscaler venait de les creer pour absorber la pointe. Les deux
    # mecanismes se neutralisaient.
    include /etc/nginx/twitninf-autoscale-upstreams.conf;
}

# ── Nœud A seul ──────────────────────────────────────────────────────────────
# Tout ce qui touche au disque doit rester sur A, qui détient les médias :
# uploads (multer écrit en local) et lecture des fichiers déjà déposés. Un
# upload servi par B écrirait sur le disque de B, où personne ne peut le lire.
upstream twitninf_api_a {
    server 127.0.0.1:3001;
}

# Le worker de A reste volontairement hors du repartiteur web. Il sert aussi de
# canal de controle pour pouvoir rallumer API A ou B apres leur arret manuel.
upstream twitninf_api_control {
    server 127.0.0.1:3004;
}

server {
    server_name twitninf.duckdns.org 51.210.11.74;

    # Les vidéos passent par ici. À 10M, nginx rejetait en 413 tout upload un
    # peu long — avant même que Node ne voie la requête — alors que l'API est
    # prévue pour recevoir la vidéo brute puis la transcoder elle-même.
    client_max_body_size 100M;
    # Plusieurs dizaines de Mo en 4G dépassent largement le défaut de 60s :
    # sans ce délai, nginx coupe un envoi parfaitement sain en cours de route.
    client_body_timeout 180s;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location /admin/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Médias : lecture — épinglés sur A ────────────────────────────────────
    # Servis par le Node de A et non depuis le disque : /home/debian n'est pas
    # lisible par l'utilisateur nginx, un `alias` renverrait des 403.
    location /storage/ {
        proxy_pass http://twitninf_api_a;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /static/ {
        proxy_pass http://twitninf_api_a;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Médias : écriture — épinglés sur A ───────────────────────────────────
    # Les cinq points d'entrée qui reçoivent un fichier (multer). Correspondance
    # exacte : ils doivent l'emporter sur `location /`.
    # NeuralRank et /api/track ne sont PLUS épinglés : le recommandeur Rust
    # écoute désormais sur le tunnel (RUST_BIND_HOST) et B l'interroge en
    # 10.8.0.1:3002. C'était nécessaire — le feed est la route la plus
    # sollicitée, la garder sur A seul annulait l'essentiel de la répartition.

    location = /api/users/me/avatar { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/users/me/banner { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/tweets/video    { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/stories         { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/stories/        { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location ~ ^/api/messages/conversations/[^/]+/messages/attachment$ {
        proxy_pass http://twitninf_api_a;
        include /etc/nginx/snippets/twitninf-proxy.conf;
    }

    # Le cockpit reste joignable sur le worker de A meme quand API A ou B est
    # volontairement arretee depuis le panneau.
    location ^~ /api/admin/infrastructure/ {
        proxy_pass http://twitninf_api_control;
        include /etc/nginx/snippets/twitninf-proxy.conf;
    }

    # PolicierCongo (chat, V3, admin et debug) vit exclusivement sur A. Le
    # streaming SSE V3 exige aussi de désactiver le buffering du proxy.
    location ~ ^/api/(?:admin/|debug/)?policiercongo(?:/|$) {
        proxy_pass http://twitninf_api_a;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # ── Tout le reste : réparti entre A et B ─────────────────────────────────
    location / {
        # Le journal compact alimente l'autoscaler avec la latence et les
        # erreurs réelles de chaque backend. Le journal combiné est conservé.
        access_log /var/log/nginx/access.log combined;
        access_log /var/log/nginx/twitninf-upstream.log twitninf_upstream_metrics;
        proxy_pass http://$twitninf_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        # Un nœud qui tombe en cours de requête : on rejoue sur l'autre plutôt
        # que de renvoyer une erreur au client.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twitninf.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twitninf.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name twitninf.duckdns.org 51.210.11.74;

    # Le domaine passe en HTTPS ; l'IP nue continue de servir en clair
    # pour ne pas casser les anciens clients qui l'utilisent encore.
    if ($host = twitninf.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 100M;
    client_body_timeout 180s;

    location /admin/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /storage/ { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location /static/  { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }

    # NeuralRank et /api/track ne sont PLUS épinglés : le recommandeur Rust
    # écoute désormais sur le tunnel (RUST_BIND_HOST) et B l'interroge en
    # 10.8.0.1:3002. C'était nécessaire — le feed est la route la plus
    # sollicitée, la garder sur A seul annulait l'essentiel de la répartition.

    location = /api/users/me/avatar { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/users/me/banner { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/tweets/video    { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/stories         { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location = /api/stories/        { proxy_pass http://twitninf_api_a; include /etc/nginx/snippets/twitninf-proxy.conf; }
    location ~ ^/api/messages/conversations/[^/]+/messages/attachment$ {
        proxy_pass http://twitninf_api_a;
        include /etc/nginx/snippets/twitninf-proxy.conf;
    }

    location ^~ /api/admin/infrastructure/ {
        proxy_pass http://twitninf_api_control;
        include /etc/nginx/snippets/twitninf-proxy.conf;
    }

    location ~ ^/api/(?:admin/|debug/)?policiercongo(?:/|$) {
        proxy_pass http://twitninf_api_a;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location / {
        access_log /var/log/nginx/access.log combined;
        access_log /var/log/nginx/twitninf-upstream.log twitninf_upstream_metrics;
        proxy_pass http://$twitninf_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
