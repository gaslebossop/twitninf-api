# Installé dans /etc/nginx/conf.d/. Ce journal ne contient ni URI, ni IP
# cliente, ni jeton : uniquement les données nécessaires à l'autoscaling.
log_format twitninf_upstream_metrics escape=json
    '{"ts":$msec,'
    '"addr":"$upstream_addr",'
    '"status":"$upstream_status",'
    '"rt":"$upstream_response_time",'
    '"total":$request_time}';
