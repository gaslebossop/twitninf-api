global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 60s
    timeout server 60s

listen twitninf_postgres_writer
    bind 127.0.0.1:6432
    mode tcp
    balance first
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server postgres_a 10.8.0.1:5432 check port 8008
    server postgres_b 10.8.0.2:5432 check port 8008
