name: Deploy API

# Déploiement automatique de l'API sur le VPS à chaque push sur `main`.
#
# Points sensibles, tous vérifiés dans le code de l'app avant d'écrire ceci :
#
#  - Les médias uploadés par les utilisateurs vivent DANS l'arbre déployé :
#    `src/public/avatars/` (servi par /static/avatars) et `storage/` (servi
#    par /storage, voir src/server.js). Sept avatars de test sont en plus
#    suivis par git. Une synchro naïve de tout l'arbre écraserait donc les
#    avatars de production par ceux du dépôt. Ces deux dossiers sont exclus,
#    et `rsync` tourne SANS `--delete` : ce qui existe sur le VPS et pas dans
#    le dépôt n'est jamais supprimé.
#
#  - `.env` n'est pas dans le dépôt (gitignore) et ne doit jamais être
#    écrasé : il est exclu explicitement.
#
#  - `package-lock.json` est gitignoré, donc absent du dépôt : `npm ci` ne
#    peut pas fonctionner. On utilise `npm install --omit=dev`.
#
#  - pm2 est la source de vérité, PAS systemd. Un service systemd
#    `twitninf-api.service` existe encore sur le VPS mais est stoppé : le
#    démarrer replante en boucle sur EADDRINUSE (même port 3001). On utilise
#    donc uniquement `pm2 restart`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux déploiements en parallèle écriraient dans le même répertoire et
# redémarreraient pm2 en même temps. On sérialise, sans annuler celui qui
# tourne déjà : l'interrompre laisserait l'arbre à moitié synchronisé.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Historique complet : le garde-fou anti-retour-arriere plus bas doit
      # pouvoir comparer le commit deploye et le commit courant.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret VPS_SSH_KEY absent. Voir l'en-tete de ce fichier."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # `tr -d '\r'` : un secret colle depuis Windows ou via l'interface
          # web arrive avec des fins de ligne CRLF. OpenSSH refuse alors la
          # cle avec « error in libcrypto », sans dire pourquoi. Le `printf`
          # garantit par ailleurs le saut de ligne final, lui aussi exige.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verification immediate : sans elle, une cle malformee ne se
          # manifeste qu'au premier ssh, sous forme d'un « Permission denied
          # (publickey) » qui fait chercher du cote des droits sur le serveur
          # alors que le probleme est le format du secret.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY est illisible par OpenSSH (format invalide ou tronque)."
            echo "Redefinis le secret en envoyant le fichier tel quel, sans copier-coller :"
            echo "  gh secret set VPS_SSH_KEY --repo <owner>/<repo> < chemin/vers/la/cle"
            exit 1
          fi
          echo "Cle privee lue par OpenSSH : format valide."

          # Empreinte epinglee si elle est fournie : c'est la seule facon de
          # se premunir d'un homme du milieu. A defaut, on la releve au vol
          # (confiance a la premiere connexion, plus faible mais utilisable).
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS absent — empreinte relevee au vol (ssh-keyscan)."
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Refuser un retour à une version antérieure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${VPS_USER}@${VPS_HOST}"

          DEPLOYED=$($SSH "cat '${VPS_PATH}/.deployed_sha' 2>/dev/null || true" | tr -d '[:space:]')

          if [ -z "$DEPLOYED" ]; then
            echo "::warning::Aucun .deployed_sha sur le VPS — premier deploiement par ce workflow."
            echo "Le contenu actuel du VPS n'a pas ete pose par ce workflow : il n'y a aucun"
            echo "moyen de savoir a quel commit il correspond. Verifie que le commit ci-dessous"
            echo "est bien plus recent que ce qui tourne en prod."
            echo "Commit a deployer : ${GITHUB_SHA}"
            exit 0
          fi

          echo "Commit deploye sur le VPS : $DEPLOYED"
          echo "Commit a deployer         : $GITHUB_SHA"

          if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
            echo "Identique — rien a faire, mais on redeploie quand meme (idempotent)."
            exit 0
          fi

          if ! git cat-file -e "${DEPLOYED}^{commit}" 2>/dev/null; then
            echo "::warning::Le commit deploye est inconnu de ce depot — comparaison impossible."
            exit 0
          fi

          # `--is-ancestor A B` est vrai si A precede B : deployer un commit
          # qui precede celui deja en prod, c'est un retour arriere.
          if git merge-base --is-ancestor "$GITHUB_SHA" "$DEPLOYED"; then
            echo "::error::Retour arriere refuse : ${GITHUB_SHA} precede ${DEPLOYED} deja en production."
            echo "Deployer ce commit remettrait une version anterieure sur le VPS."
            exit 1
          fi

          echo "Le commit est posterieur a celui en production — deploiement autorise."

      - name: Sauvegarder la version en place sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          VPS_PATH=$(printf '%s' "$VPS_PATH" | tr -d '[:space:]')
          VPS_PATH=${VPS_PATH%/}

          # Filet de securite : une archive de l'arbre courant AVANT toute
          # ecriture, pour pouvoir revenir en arriere a la main si le
          # deploiement casse quelque chose. Les medias et node_modules en
          # sont exclus (volumineux, et de toute facon jamais ecrases).
          #
          # Aucun `|| true` ici, volontairement. La premiere version en avait
          # un : quand tar a echoue sur un chemin invalide, il a produit une
          # archive de 20 octets contenant zero fichier, sans que rien ne le
          # signale, et le deploiement a continue. Un filet muet et vide est
          # pire que pas de filet.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          test -d "${VPS_PATH}" || { echo "Repertoire introuvable : ${VPS_PATH}" >&2; exit 1; }
          BACKUP_DIR="\$HOME/deploy-backups"
          mkdir -p "\$BACKUP_DIR"
          ARCHIVE="\$BACKUP_DIR/api-\$(date +%Y%m%d-%H%M%S).tar.gz"
          tar -czf "\$ARCHIVE" \
            --exclude=node_modules \
            --exclude=storage \
            --exclude=src/public/avatars \
            -C "${VPS_PATH}" .
          # Une archive vide sort de tar sans erreur : on compte les entrees.
          COUNT=\$(tar -tzf "\$ARCHIVE" | wc -l)
          echo "Sauvegarde : \$ARCHIVE (\$COUNT entrees)"
          if [ "\$COUNT" -lt 50 ]; then
            echo "Archive anormalement vide — deploiement interrompu." >&2
            exit 1
          fi
          # On ne garde que les cinq dernieres, pour ne pas remplir le disque.
          ls -1t "\$BACKUP_DIR"/api-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          ls -lh "\$BACKUP_DIR"/api-*.tar.gz | tail -5
          EOF

      - name: Synchroniser le code
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          # Un espace, un retour a la ligne ou un CR en fin de secret suffit a
          # rendre le chemin distant invalide : rsync tente alors de creer un
          # repertoire au nom errone et echoue sur « No such file or
          # directory », alors que la vraie cible existe. On nettoie.
          VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          VPS_PATH=$(printf '%s' "$VPS_PATH" | tr -d '[:space:]')
          VPS_PATH=${VPS_PATH%/}

          # La cible doit exister AVANT rsync : sinon il essaie de la creer et
          # masque une erreur de configuration derriere une erreur d'IO.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes             "${VPS_USER}@${VPS_HOST}"             "test -d '${VPS_PATH}' || { echo \"Repertoire cible introuvable : ${VPS_PATH}\" >&2; exit 1; }"

          rsync -az --human-readable \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='src/public/avatars/' \
            --exclude='storage/' \
            --exclude='tmp/' \
            --exclude='reports/' \
            --exclude='.task-cache/' \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Installer les dépendances et redémarrer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${VPS_PATH}"
          # Pas de 'npm ci' : package-lock.json est gitignore, donc absent.
          npm install --omit=dev --no-audit --no-fund
          pm2 restart twitninf-api --update-env
          pm2 save
          # Trace du commit reellement en place : c'est ce que lit le
          # garde-fou anti-retour-arriere au deploiement suivant.
          echo "${GITHUB_SHA}" > "${VPS_PATH}/.deployed_sha"
          EOF

      - name: Vérifier que l'API répond
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Un 'pm2 restart' rend la main avant que le process ecoute. On
          # laisse jusqu'a 60 s, puis on echoue franchement : un deploiement
          # qui casse la prod ne doit pas apparaitre vert.
          for i in $(seq 1 12); do
            code=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true")
            echo "Tentative $i/12 — /api/health => ${code:-aucune reponse}"
            if [ "$code" = "200" ]; then
              echo "API en ligne."
              exit 0
            fi
            sleep 5
          done
          echo "::error::L'API ne repond pas sur /api/health apres le redemarrage."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" "pm2 list; pm2 logs twitninf-api --lines 40 --nostream" || true
          exit 1

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
