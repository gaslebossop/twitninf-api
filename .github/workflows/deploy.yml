name: Deploy API

# Déploiement automatique de l'API sur les VPS à chaque push sur `main`.
#
# Points sensibles, tous vérifiés dans le code de l'app avant d'écrire ceci :
#
#  - Les médias uploadés par les utilisateurs vivent DANS l'arbre déployé :
#    `src/public/` (avatars, bannières, messages, stories — servis par /static)
#    et `storage/` (servi par /storage, voir src/server.js). Sept avatars de
#    test sont en plus suivis par git. Une synchro naïve de tout l'arbre
#    écraserait donc les médias de production par ceux du dépôt. Ces dossiers
#    sont exclus, et `rsync` tourne SANS `--delete` : ce qui existe sur le VPS
#    et pas dans le dépôt n'est jamais supprimé.
#
#  - `.env` n'est pas dans le dépôt (gitignore) et ne doit jamais être
#    écrasé : il est exclu explicitement. C'est d'autant plus vital depuis le
#    passage à deux serveurs : chaque hôte a le sien (NODE_ROLE, PORT, hôtes
#    base/cache/recommandeur différents).
#
#  - `package-lock.json` est gitignoré, donc absent du dépôt : `npm ci` ne
#    peut pas fonctionner. On utilise `npm install --omit=dev`.
#
#  - pm2 est la source de vérité, PAS systemd. Un service systemd
#    `twitninf-api.service` existe encore sur le VPS A mais est stoppé : le
#    démarrer replante en boucle sur EADDRINUSE (même port 3001).
#
# ── Déploiement sur deux serveurs ───────────────────────────────────────────
#
#  - Les hôtes sont traités l'un APRÈS l'autre, jamais en parallèle : pendant
#    que l'un redémarre, l'autre continue de servir le trafic derrière le
#    répartiteur nginx. Les redémarrer ensemble, c'est une coupure franche.
#
#  - Si le premier hôte échoue à son contrôle de santé, le second n'est pas
#    touché : la moitié du parc reste sur la version qui fonctionne.
#
#  - Les noms des process pm2 diffèrent d'un hôte à l'autre (`twitninf-api` +
#    `twitninf-api-worker` sur A, `twitninf-api-web` sur B). On les découvre au
#    lieu de les coder en dur, et on ne touche qu'à ceux préfixés
#    `twitninf-api` — un `pm2 reload all` emporterait les autres process de la
#    machine.
#
#  - Contrôle final : il ne doit exister QU'UN SEUL process `NODE_ROLE=worker`
#    dans tout le parc. Deux workers = PolicierCongo, TwitNinfAI et les purges
#    exécutés en double. Ce contrôle interroge /api/health, qui expose le rôle
#    réellement retenu par le process — la configuration, elle, peut mentir.
#
# Secrets attendus : VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_USER, VPS_PATH,
# VPS_HOST (serveur A) et VPS_HOST_B (serveur B, facultatif — s'il est absent,
# le workflow déploie uniquement sur A et le dit).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux déploiements en parallèle écriraient dans le même répertoire et
# redémarreraient pm2 en même temps. On sérialise, sans annuler celui qui
# tourne déjà : l'interrompre laisserait l'arbre à moitié synchronisé.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Historique complet : le garde-fou anti-retour-arriere plus bas doit
      # pouvoir comparer le commit deploye et le commit courant.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_B: ${{ secrets.VPS_HOST_B }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret VPS_SSH_KEY absent. Voir l'en-tete de ce fichier."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # `tr -d '\r'` : un secret colle depuis Windows ou via l'interface
          # web arrive avec des fins de ligne CRLF. OpenSSH refuse alors la
          # cle avec « error in libcrypto », sans dire pourquoi. Le `printf`
          # garantit par ailleurs le saut de ligne final, lui aussi exige.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verification immediate : sans elle, une cle malformee ne se
          # manifeste qu'au premier ssh, sous forme d'un « Permission denied
          # (publickey) » qui fait chercher du cote des droits sur le serveur
          # alors que le probleme est le format du secret.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY est illisible par OpenSSH (format invalide ou tronque)."
            echo "Redefinis le secret en envoyant le fichier tel quel, sans copier-coller :"
            echo "  gh secret set VPS_SSH_KEY --repo <owner>/<repo> < chemin/vers/la/cle"
            exit 1
          fi
          echo "Cle privee lue par OpenSSH : format valide."

          # Empreinte epinglee si elle est fournie : c'est la seule facon de
          # se premunir d'un homme du milieu. A defaut, on la releve au vol
          # (confiance a la premiere connexion, plus faible mais utilisable).
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS absent — empreinte relevee au vol (ssh-keyscan)."
            for h in "$VPS_HOST" "${VPS_HOST_B:-}"; do
              [ -n "$h" ] && ssh-keyscan -H "$h" >> ~/.ssh/known_hosts 2>/dev/null || true
            done
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Refuser un retour à une version antérieure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          # Le garde-fou s'appuie sur le serveur A, qui fait foi : c'est lui qui
          # porte la base et les medias.
          SSH="ssh $SSH_OPTS ${VPS_USER}@${VPS_HOST}"

          DEPLOYED=$($SSH "cat '${VPS_PATH}/.deployed_sha' 2>/dev/null || true" | tr -d '[:space:]')

          if [ -z "$DEPLOYED" ]; then
            echo "::warning::Aucun .deployed_sha sur le VPS — premier deploiement par ce workflow."
            echo "Le contenu actuel du VPS n'a pas ete pose par ce workflow : il n'y a aucun"
            echo "moyen de savoir a quel commit il correspond. Verifie que le commit ci-dessous"
            echo "est bien plus recent que ce qui tourne en prod."
            echo "Commit a deployer : ${GITHUB_SHA}"
            exit 0
          fi

          echo "Commit deploye sur le VPS : $DEPLOYED"
          echo "Commit a deployer         : $GITHUB_SHA"

          if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
            echo "Identique — rien a faire, mais on redeploie quand meme (idempotent)."
            exit 0
          fi

          if ! git cat-file -e "${DEPLOYED}^{commit}" 2>/dev/null; then
            echo "::warning::Le commit deploye est inconnu de ce depot — comparaison impossible."
            exit 0
          fi

          # `--is-ancestor A B` est vrai si A precede B : deployer un commit
          # qui precede celui deja en prod, c'est un retour arriere.
          if git merge-base --is-ancestor "$GITHUB_SHA" "$DEPLOYED"; then
            echo "::error::Retour arriere refuse : ${GITHUB_SHA} precede ${DEPLOYED} deja en production."
            echo "Deployer ce commit remettrait une version anterieure sur le VPS."
            exit 1
          fi

          echo "Le commit est posterieur a celui en production — deploiement autorise."

      - name: Déployer, hôte par hôte
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_B: ${{ secrets.VPS_HOST_B }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          # Un espace, un retour a la ligne ou un CR en fin de secret suffit a
          # rendre le chemin distant invalide : rsync tente alors de creer un
          # repertoire au nom errone et echoue sur « No such file or
          # directory », alors que la vraie cible existe. On nettoie.
          VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          VPS_PATH=$(printf '%s' "$VPS_PATH" | tr -d '[:space:]')
          VPS_PATH=${VPS_PATH%/}

          HOSTS="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          if [ -n "${VPS_HOST_B:-}" ]; then
            HOSTS="$HOSTS $(printf '%s' "$VPS_HOST_B" | tr -d '[:space:]')"
          else
            echo "::warning::VPS_HOST_B absent — deploiement sur le seul serveur A."
          fi

          for host in $HOSTS; do
            echo "::group::Deploiement sur $host"
            SSH="ssh $SSH_OPTS ${VPS_USER}@${host}"

            # La cible doit exister AVANT rsync : sinon il essaie de la creer et
            # masque une erreur de configuration derriere une erreur d'IO.
            $SSH "test -d '${VPS_PATH}' || { echo \"Repertoire cible introuvable : ${VPS_PATH}\" >&2; exit 1; }"

            rsync -az --human-readable \
              -e "ssh $SSH_OPTS" \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='.env' \
              --exclude='*.log' \
              --exclude='src/public/avatars/' \
              --exclude='src/public/banners/' \
              --exclude='src/public/messages/' \
              --exclude='src/public/stories/' \
              --exclude='src/public/tweets/' \
              --exclude='src/public/videos/' \
              --exclude='storage/' \
              --exclude='data/' \
              --exclude='core.*' \
              --exclude='tmp/' \
              --exclude='reports/' \
              --exclude='.task-cache/' \
              --exclude='src/services/policiercongo/scheduler.json' \
              ./ "${VPS_USER}@${host}:${VPS_PATH}/"

            # Les noms de process different d'un hote a l'autre : on les
            # decouvre. `reload` plutot que `restart` pour ne pas couper net.
            $SSH bash -s <<EOF
          set -euo pipefail
          cd "${VPS_PATH}"
          npm install --omit=dev --no-audit --no-fund
          names=\$(pm2 jlist 2>/dev/null | grep -o '"name":"twitninf-api[^"]*"' | cut -d'"' -f4 | sort -u)
          if [ -z "\$names" ]; then
            echo "Aucun process pm2 nomme twitninf-api* sur cet hote." >&2
            exit 1
          fi
          for n in \$names; do
            echo "reload \$n"
            pm2 reload "\$n" --update-env
          done
          pm2 save
          echo "${GITHUB_SHA}" > "${VPS_PATH}/.deployed_sha"
          EOF

            # Un reload rend la main avant que le process ecoute a nouveau : le
            # demarrage prend une trentaine de secondes (modele d'embeddings,
            # index semantique, moteurs de recommandation). On attend jusqu'a
            # 120 s, puis on echoue franchement — un deploiement qui casse la
            # prod ne doit pas apparaitre vert.
            ok=0
            for i in $(seq 1 24); do
              code=$($SSH "curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3001/api/health || true")
              echo "  $host — tentative $i/24 : /api/health => ${code:-aucune reponse}"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done

            if [ "$ok" != "1" ]; then
              echo "::error::$host ne repond pas sur /api/health apres le rechargement."
              echo "Les hotes suivants n'ont PAS ete deployes : ils continuent de servir l'ancienne version."
              $SSH "pm2 list; pm2 logs --lines 40 --nostream" || true
              exit 1
            fi
            echo "  $host — en ligne."
            echo "::endgroup::"
          done

      - name: Vérifier qu'il n'y a qu'un seul worker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_B: ${{ secrets.VPS_HOST_B }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          HOSTS="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          [ -n "${VPS_HOST_B:-}" ] && HOSTS="$HOSTS $(printf '%s' "$VPS_HOST_B" | tr -d '[:space:]')"

          workers=0
          for host in $HOSTS; do
            for port in 3001 3003 3004; do
              body=$(ssh $SSH_OPTS "${VPS_USER}@${host}" \
                "curl -s --max-time 6 http://127.0.0.1:${port}/api/health || true")
              case "$body" in *'"success":true'*) ;; *) continue ;; esac
              role=$(printf '%s' "$body" | grep -o '"role":"[a-z]*"' | cut -d'"' -f4)
              echo "  ${host}:${port} => ${role:-inconnu}"
              case "$role" in worker|all) workers=$((workers + 1)) ;; esac
            done
          done

          if [ "$workers" -gt 1 ]; then
            echo "::error::${workers} process worker detectes. PolicierCongo, TwitNinfAI et les purges"
            echo "tourneraient en double. Un seul process doit avoir NODE_ROLE=worker — et attention,"
            echo "NODE_ROLE absent vaut 'all', donc compte comme un worker."
            exit 1
          fi
          if [ "$workers" -eq 0 ]; then
            echo "::warning::Aucun worker detecte — les taches de fond ne tournent nulle part."
          fi

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
